<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Canvas NHL Stenden: de landkaart van alle AI-activiteiten, teams, pilots, beleid en externe samenwerkingen binnen NHL Stenden." />
    <title>AI Canvas NHL Stenden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Verborgen formulier zodat Netlify Forms het meldformulier herkent bij de build -->
    <form name="meld-activiteit" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="soort" /><input name="naam" /><textarea name="omschrijving"></textarea>
      <input name="onderdeel" /><input name="sporen" /><input name="status" /><input name="periode" /><input name="link" />
      <input name="verbonden_met" /><input name="relatie" /><input name="aanvulling_op" />
      <input name="melder_naam" /><input name="melder_email" /><input name="melder_rol" /><input name="naam_tonen" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
